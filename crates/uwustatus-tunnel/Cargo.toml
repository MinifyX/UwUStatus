[package]
name = "uwustatus-tunnel"
description = "The QUIC tunnel between the UwUStatus main instance and its satellites"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository = "https://github.com/MinifyX/UwUStatus"
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
data-encoding = "2"
getrandom = "0.4"
hex = "0.4"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = "0.1"

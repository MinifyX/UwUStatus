[package]
name = "uwustatus-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Prüfungen für UwUStatus (HTTP, TCP, Ping, DNS, SMTP/IMAP, Docker, Suite-/healthz)"

[dependencies]
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }

[dev-dependencies]
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints.rust]
unsafe_code = "deny"

[workspace]
resolver = "3"
members = [
    "crates/uwustatus-server",
    "crates/uwustatus-probe",
    "crates/uwustatus-tunnel",
    "crates/uwustatus-notify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
